<!DOCTYPE html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENO TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;padding:16px}h1{color:#e50914;margin:0 0 10px}.row{display:flex;gap:8px}input{flex:1;padding:16px;font-size:18px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}button{padding:16px 20px;background:#e50914;color:#fff;border:0;border-radius:8px;font-weight:bold}video{width:100%;height:55vh;background:#000;margin:14px 0;border-radius:12px}.channel{padding:14px;border-bottom:1px solid #222;cursor:pointer;border-radius:8px}.channel:focus,.channel:hover{background:#e50914;outline:none}small{color:#aaa}</style></head><body><h1>ZENO TV</h1><small>Ngjit M3U linkun tend - Nuk ka kanale te perfshira</small><div class="row" style="margin-top:10px"><input id="m3u" placeholder="http://.../playlist.m3u"><button onclick="loadM3U()">LOAD</button></div><video id="video" controls></video><div id="list"></div><script>async function loadM3U(){let url=document.getElementById('m3u').value.trim();if(!url)return alert('Ngjit linkun M3U!');try{localStorage.setItem('zeno_m3u',url);let t=await fetch(url).then(r=>r.text());parse(t);}catch(e){alert('Linku nuk hapet.')}}function parse(text){let lines=text.split('\n'),name='',list=document.getElementById('list');list.innerHTML='';for(let l of lines){l=l.trim();if(l.startsWith('#EXTINF')){name=l.split(',').pop()||'Kanal';}else if(l.startsWith('http')){let d=document.createElement('div');d.className='channel';d.tabIndex=0;d.textContent=name||l;d.dataset.url=l;d.onclick=()=>play(l);d.onkeydown=e=>{if(e.key==='Enter')play(l)};list.appendChild(d);name='';}}}function play(url){let v=document.getElementById('video');if(Hls.isSupported()){let h=new Hls();h.loadSource(url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}else{v.src=url;v.play();}}window.onload=()=>{let s=localStorage.getItem('zeno_m3u');if(s){document.getElementById('m3u').value=s;loadM3U();}};</script></body></html>
