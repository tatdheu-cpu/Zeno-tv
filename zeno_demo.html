<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENO TV</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#0d1324;color:white}header{padding:28px 22px;background:linear-gradient(115deg,#162640,#633f9a);font-size:34px;font-weight:900;letter-spacing:2px}small{font-weight:400;letter-spacing:0;display:block;font-size:13px;color:#ddd}main{max-width:850px;margin:auto;padding:24px}.tabs{display:flex;gap:10px;margin-bottom:20px}.tab{background:#283851;padding:13px;border-radius:11px;flex:1;text-align:center}.active{background:#8151d8}input,button{font:inherit;border:0;border-radius:12px;padding:14px}input{width:100%;color:white;background:#222e49}button{background:#7c59db;color:white;cursor:pointer;margin-top:10px}video{width:100%;background:black;aspect-ratio:16/9;border-radius:12px;margin-top:15px}.item{display:block;width:100%;margin:7px 0;text-align:left;background:#26334d}.muted{color:#aab6cf;font-size:14px}</style></head><body><header>ZENO TV<small>Live TV · Movies · Series</small></header><main><div class="tabs"><div class="tab active">📺 LIVE TV</div><div class="tab">🎬 MOVIES</div><div class="tab">📺 SERIES</div></div><p>Shto lidhjen tënde M3U (burim i autorizuar):</p><input id="url" placeholder="https://shembull.com/lista.m3u"><button id="load">Ngarko listën</button><p class="muted" id="status">Demo: Nuk përfshihen kanale.</p><video id="video" controls playsinline></video><div id="list"></div><p class="muted">Shënim: Në Safari mund të mos lejohen disa lista për shkak të kufizimeve CORS. Për Fire TV përdor projektin Android.</p></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script><script>const $=id=>document.getElementById(id);let hls=null;$('load').onclick=async()=>{const u=$('url').value.trim();if(!/^https?:\/\//.test(u)){ $('status').textContent='Shkruaj një adresë të vlefshme.';return;}try{$('status').textContent='Duke ngarkuar...';const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const txt=await r.text();let name='',channels=[];for(let raw of txt.split(/\r?\n/)){let line=raw.trim();if(line.startsWith('#EXTINF'))name=line.split(',').slice(1).join(',')||'Kanal';else if(/^https?:\/\//.test(line)){channels.push({name:name||'Kanal',url:line});name='';}}$('status').textContent=channels.length+' kanale u gjetën.';$('list').replaceChildren();for(let ch of channels.slice(0,1000)){const b=document.createElement('button');b.className='item';b.textContent='▶ '+ch.name;b.onclick=()=>{if(hls){hls.destroy();hls=null;}const v=$('video');if(ch.url.includes('.m3u8') && window.Hls && Hls.isSupported()){hls=new Hls();hls.loadSource(ch.url);hls.attachMedia(v);}else v.src=ch.url;v.play().catch(()=>{});};$('list').append(b);}}catch(e){$('status').textContent='Nuk mund të lexohet lista: '+e.message+' (mund të jetë CORS).';}};</script></body></html>
